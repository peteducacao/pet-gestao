name: PET Gestão — publicar aplicação real
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-live.js'
      - 'styles.css'
      - 'live.css'
      - 'config.js'
      - 'assets/**'
      - 'worker/**'
      - 'scripts/prepare-deploy.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pet-gestao-producao
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
      MAIL_BRIDGE_TOKEN: ${{ secrets.MAIL_BRIDGE_TOKEN }}
      MAIL_BRIDGE_URL: ${{ secrets.MAIL_BRIDGE_URL }}
      PET_GESTAO_API_URL: ${{ vars.PET_GESTAO_API_URL }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check app-live.js
          node --check scripts/prepare-deploy.mjs
          node --check --input-type=module < worker/src/index.js
      - name: Validar todas as migrações SQL e os cenários de teste
        run: |
          python3 - <<'PY'
          import glob, sqlite3
          c=sqlite3.connect(':memory:')
          c.execute('PRAGMA foreign_keys=ON')
          paths=sorted(glob.glob('worker/migrations/*.sql'))
          for path in paths:
              if path.endswith('0010_cenarios_teste.sql'):
                  c.execute("""INSERT INTO users(id,name,email,pass_hash,pass_salt,role,created_at,updated_at)
                    VALUES ('admin-teste-ci','Admin de CI','ci@example.org','hash','salt','admin',
                    '2026-11-10T00:00:00Z','2026-11-10T00:00:00Z')""")
              c.executescript(open(path,encoding='utf-8').read())
          assert c.execute('SELECT COUNT(*) FROM commissions').fetchone()[0]==10
          if any(p.endswith('0010_cenarios_teste.sql') for p in paths):
              assert c.execute("SELECT COUNT(*) FROM tasks WHERE id LIKE 'pet-teste-20261110-%'").fetchone()[0]>=20
              assert c.execute("SELECT COUNT(*) FROM email_queue WHERE id LIKE 'pet-email-teste-20261110-%'").fetchone()[0]>=4
              assert c.execute('PRAGMA foreign_key_check').fetchall()==[]
          print('Migrações verificadas:', len(paths), 'arquivos; integridade referencial preservada.')
          PY
      - name: Preparar configurações e arquivos públicos
        run: node scripts/prepare-deploy.mjs
      - name: Conferir URL publica gerada e fallback do site
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const result={window:{}};
          vm.runInNewContext(fs.readFileSync('_site/config.js','utf8'),result);
          const url=result.window.PET_GESTAO_CONFIG?.apiBaseUrl||'';
          if(!/^https:\/\/[a-z0-9.-]+(?:\/.*)?$/i.test(url))throw Error('O config.js gerado não inclui uma URL HTTPS válida.');
          const html=fs.readFileSync('_site/index.html','utf8');
          const app=fs.readFileSync('_site/app-live.js','utf8');
          if(!html.includes('window.PET_GESTAO_CONFIG=Object.freeze('))throw Error('Faltou a URL pública de contingência no HTML.');
          if(!app.includes('const API_FALLBACK='))throw Error('Faltou o fallback da API no JavaScript.');
          console.log('Configuração pública presente em _site, sem credenciais.');
          JS
      - name: Validar credenciais protegidas
        run: |
          test -n "$ADMIN_EMAIL" && test -n "$ADMIN_INITIAL_PASSWORD"
          test -n "$MAIL_BRIDGE_TOKEN" && test -n "$MAIL_BRIDGE_URL"
          if [ "${#ADMIN_INITIAL_PASSWORD}" -lt 10 ]; then
            echo "::error::O secret ADMIN_INITIAL_PASSWORD deve ter pelo menos 10 caracteres."
            exit 1
          fi
          if [[ ! "$ADMIN_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::O secret ADMIN_EMAIL não contém um e-mail válido."
            exit 1
          fi
      - name: Instalar Cloudflare Wrangler
        run: npm install -g wrangler@4
      - name: Aplicar migrações ao D1
        run: wrangler d1 migrations apply pet-gestao-db --remote --config wrangler.json
      - name: Publicar API e rotina de e-mails
        run: wrangler deploy --config wrangler.json
      - name: Configurar segredos do Worker
        run: |
          printf '%s' "$ADMIN_EMAIL" | wrangler secret put ADMIN_EMAIL --config wrangler.json
          printf '%s' "$ADMIN_INITIAL_PASSWORD" | wrangler secret put ADMIN_INITIAL_PASSWORD --config wrangler.json
          printf '%s' "$MAIL_BRIDGE_TOKEN" | wrangler secret put MAIL_BRIDGE_TOKEN --config wrangler.json
          printf '%s' "$MAIL_BRIDGE_URL" | wrangler secret put MAIL_BRIDGE_URL --config wrangler.json
      - name: Verificar Gmail sem enviar mensagens
        run: node scripts/check-mail-bridge.mjs
      - name: Testar API após publicação
        run: |
          API_URL="$(cat api-url.txt)"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 "$API_URL/api/v1/health"
          echo
          HTTP_CODE="$(curl --silent --show-error --retry 3 --retry-delay 3 -o /tmp/pet-gestao-bootstrap.json -w '%{http_code}' "$API_URL/api/v1/bootstrap")"
          if [ "$HTTP_CODE" != "200" ]; then
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/pet-gestao-bootstrap.json'))
          except Exception:
              d={}
          print("::error::API /bootstrap falhou; código HTTP e diagnóstico:", d.get("code","desconhecido"), d.get("stage","desconhecido"))
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pet-gestao-bootstrap.json'))
          assert isinstance(d.get('committees'), list), 'Comissões não foram carregadas'
          assert isinstance(d.get('tasks'), list), 'Demandas não foram carregadas'
          assert d.get('session') is None, 'Consulta pública não pode expor sessão'
          print('API e estrutura pública validadas sem modificar cadastros.')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: pages
        uses: actions/deploy-pages@v4
