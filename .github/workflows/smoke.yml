name: Testes do PET Gestão
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-live.js'
      - 'live.css'
      - 'assets/**'
      - 'site.webmanifest'
      - 'sw.js'
      - 'scripts/build-pwa-icons.mjs'
      - 'scripts/test-brand-icons.mjs'
      - 'scripts/test-ui.mjs'
      - 'scripts/test-browser.mjs'
      - 'scripts/test-vagas-mobile.mjs'
      - 'scripts/test-browser-sessions.mjs'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check app-live.js
          node --check --input-type=module < worker/src/index.js
          node --check scripts/test-ui.mjs
          node --check scripts/test-startup-splash.mjs
          node --check scripts/test-pwa-install.mjs
          node --check scripts/test-ios-pwa.mjs
      - name: Testar regras e permissões do novo Cronograma
        run: node scripts/test-cronograma.mjs
      - name: Testar visão geral e contagem única de todos os relatórios
        run: node scripts/test-overview-report.mjs
      - name: Validar importação do Cronograma 2026 e integridade referencial
        run: python3 scripts/test-cronograma-2026.py
      - name: Verificar iOS, privacidade e rotas de notificações
        run: node scripts/test-ios-pwa.mjs
      - name: Testar tela de abertura antes de publicar
        run: node scripts/test-startup-splash.mjs
      - name: Verificar todas as variações da nova marca, inclusive PNGs
        run: node scripts/test-brand-icons.mjs
      - name: Instalar dependência de teste
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Testar interface e fluxos simulados
        run: node scripts/test-ui.mjs

  navegador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validar Vagas em telas pequenas (isolado)
        run: node scripts/test-vagas-mobile.mjs
      - name: Clicar e verificar telas no navegador
        run: node scripts/test-browser.mjs
      - name: Impedir duas identidades em abas do mesmo navegador
        run: node scripts/test-browser-sessions.mjs
