name: PET Gestão — gerar APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código do PET Gestão
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Instalar plataforma Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android SDK não encontrado"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Validar Firebase Android quando configurado
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android-app/app/google-services.json
            python3 - <<'PY'
          import json
          with open("android-app/app/google-services.json",encoding="utf8") as f: j=json.load(f)
          clients=[c for c in j.get("client",[]) if c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="br.ufs.peteducacao.gestao"]
          if not clients or not j.get("project_info",{}).get("project_id"):
              raise SystemExit("Firebase não contém o pacote br.ufs.peteducacao.gestao.")
          print("Configuração Android do Firebase validada sem exibir dados privados.")
          PY
          else
            echo "::warning::Firebase não configurado: APK instala, mas não receberá push até criar FIREBASE_GOOGLE_SERVICES_JSON_B64."
          fi

      - name: Compilar APK de instalação
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar instalador
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/PET-Gestao.apk
          ls -lh dist/PET-Gestao.apk

      - name: Disponibilizar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PET-Gestao-APK
          path: dist/PET-Gestao.apk
          retention-days: 90
          if-no-files-found: error

      - name: Disponibilizar link público do APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-apk >/dev/null 2>&1; then
            gh release upload android-apk dist/PET-Gestao.apk --clobber
          else
            gh release create android-apk dist/PET-Gestao.apk \
              --title "PET Gestão — APK Android" \
              --notes "APK de teste instalável no Android, sem Play Store. Usa a interface oficial do GitHub Pages e os dados do Cloudflare. Requer conexão para sincronização. É assinado como build de debug; para futuras atualizações nativas, configurar assinatura privada estável."
          fi

      - name: Atualizar download do APK no GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O primeiro deploy pode ocorrer antes da compilação Android.
          # Este disparo atualiza o arquivo /downloads/ com a versão recém-publicada.
          gh workflow run pages.yml --ref main
