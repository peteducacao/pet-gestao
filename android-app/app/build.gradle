plugins {
    id 'com.android.application'
}

android {
    namespace 'br.ufs.peteducacao.gestao'
    compileSdk 35

    defaultConfig {
        applicationId 'br.ufs.peteducacao.gestao'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// O Firebase é ativado apenas quando o JSON do projeto foi fornecido
// de forma segura ao workflow (nunca versionar google-services.json).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}
